# Reglas SAST del MVP Daash ERP & DTE.
# Ejecutar: semgrep --config semgrep.yml --metrics off .
# Las reglas son de apoyo a docs/SECURITY_VALIDATION.md; no sustituyen la revisión humana.
rules:
  - id: hardcoded-secret-literal
    message: >-
      Posible secreto hardcodeado (JWT, refresh, DTE, API key o contraseña).
      Obtener el valor de variables de entorno (.env / Docker secrets), nunca del código fuente.
    severity: ERROR
    languages:
      - generic
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      technology:
        - java
        - javascript
        - typescript
        - config
    patterns:
      - pattern-regex: |-
          (?i)\b(jwt[_-]?secret|refresh[_-]?secret|dte[_-]?signing[_-]?secret|api[_-]?key|secret|password|passwd|pwd|clave|token|private[_-]?key)\b\s*[:=]\s*['"][^'"$\n]{6,}['"]
      - pattern-not-regex: |-
          (?i)(process\.env|import\.meta\.env|System\.getenv|\$\{|@Value|<[a-z_]+>|\{\{|env\.|secrets\.|variables\.|ENC\()
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/dist/**"
        - "**/target/**"
        - "**/evidence/**"
        - "**/docs/**"
        - README.md
        - semgrep.yml
        - .env.example

  - id: sql-query-string-concatenation
    message: >-
      Consulta SQL construida por concatenación. Riesgo de inyección SQL (CA-01).
      Usar JPA/Hibernate con consultas parametrizadas o PreparedStatement con marcadores '?'.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      technology:
        - java
        - spring
        - jpa
    patterns:
      - pattern-either:
          - pattern: $S.executeQuery($A + $B)
          - pattern: $S.prepareStatement($A + $B)
          - pattern: $S.createNativeQuery($A + $B)
          - pattern: $S.createQuery($A + $B)
          - pattern-regex: |-
              (?i)["'](select\s|insert\s+into\s|update\s|delete\s+from\s)[^"']*["']\s*\+\s*[$a-zA-Z_]

  - id: weak-crypto-java
    message: >-
      Uso de primitiva criptográfica débil (MD5, SHA-1, DES, RC4 o Random para secretos).
      Usar SHA-256 o superior y java.security.SecureRandom (RNF-04 / CA-02).
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MessageDigest.getInstance("SHA")
          - pattern: Cipher.getInstance("DES")
          - pattern: Cipher.getInstance("DESede")
          - pattern: Cipher.getInstance("RC4")
          - pattern-regex: |-
              new\s+(java\.util\.)?Random\s*\(

  - id: weak-crypto-javascript
    message: >-
      Hash o HMAC con algoritmo débil. Usar SHA-256 o superior.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5", ...)
          - pattern: crypto.createHash('md5', ...)
          - pattern: crypto.createHash("sha1", ...)
          - pattern: crypto.createHmac("md5", ...)
          - pattern-regex: |-
              (?i)(createHash|createHmac)\(\s*['"](md5|sha1|sha-1)['"]

  - id: jwt-parsed-without-signature-verification
    message: >-
      Parser de JWT utilizado sin verificación de firma explícita (setSigningKey/verifyWith).
      Un token sin verificar permite escalada de privilegios (CA-02); validar firma, expiración e issuer.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
    patterns:
      - pattern-regex: |-
          Jwts\.(parser|parserBuilder)\(\)[\s\S]{0,200}?\.parse(ClaimsJws|SignedClaims|Claims)?\s*\(
      - pattern-not-regex: |-
          (setSigningKey|verifyWith)

  - id: jwt-decode-without-verify-javascript
    message: >-
      Decodificación de JWT sin verificación de firma. Verificar siempre con jwt.verify(...)
      antes de confiar en los claims de rol (CA-02).
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: jwt.decode($TOKEN, ...)
          - pattern: decodeJwt($TOKEN)
      - pattern-not-regex: |-
          jwt\.verify\s*\(

  - id: frontend-console-log-sensitive-data
    message: >-
      Posible exposición de datos sensibles en consola del navegador (contraseñas, tokens,
      DUI/NIT, correo o tarjeta). Eliminar el log o redactar el valor.
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: console.log(..., $X, ...)
          - pattern: console.info(..., $X, ...)
          - pattern: console.debug(..., $X, ...)
          - pattern: console.error(..., $X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: '(?i)(pass(word|wd)?|pwd|clave|secret|token|jwt|refresh|api[_-]?key|authorization|dui|nit|email|correo|tarjeta|card|cvv)'
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/dist/**"

  - id: react-dangerously-set-inner-html
    message: >-
      Uso de dangerouslySetInnerHTML en React. Riesgo de XSS (CA-03): React escapa por defecto;
      evitar esta escape hatch o sanitizar previamente con una librería auditada.
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      technology:
        - react
    patterns:
      - pattern-regex: |-
          dangerouslySetInnerHTML
    paths:
      exclude:
        - "**/node_modules/**"
        - "**/dist/**"
