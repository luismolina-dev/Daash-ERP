spring:
  application:
    name: daash-erp-dte
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          ssl:
            enable: ${MAIL_SSL:false}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:daash}
    username: ${POSTGRES_USER:daash}
    password: ${POSTGRES_PASSWORD:daash_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET:daash-access-secret-change-me-in-production-0123456789abcdef}
refresh:
  secret: ${REFRESH_SECRET:daash-refresh-secret-change-me-in-production-0123456789abcdef}
dte:
  signing-secret: ${DTE_SIGNING_SECRET:daash-dte-signing-secret-change-me-in-production-0123456789abcdef}
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:${SSL_ENABLED:false}}
  mail-from: ${MAIL_FROM:no-reply@daash.local}
  company:
    nombre: ${COMPANY_NAME:Adventure Works S.A. de C.V.}
    nit: ${COMPANY_NIT:0614-123456-100-0}
    nrc: ${COMPANY_NRC:1234-5}
    direccion: ${COMPANY_ADDRESS:San Salvador, El Salvador}

logging:
  level:
    com.daash: INFO
