spring:
  datasource:
    url: jdbc:h2:mem:daash_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-access-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz
refresh:
  secret: test-refresh-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz
dte:
  signing-secret: test-dte-signing-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz
app:
  frontend-origin: http://localhost:5173
  cookie-secure: false
