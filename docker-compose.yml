services:
  postgres:
    image: postgres:16
    container_name: daash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daash}
      POSTGRES_USER: ${POSTGRES_USER:-daash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daash_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daash} -d ${POSTGRES_DB:-daash}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daash-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-daash}
      POSTGRES_USER: ${POSTGRES_USER:-daash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daash_secret}
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-daash-access-secret-change-me-in-production-0123456789abcdef}
      REFRESH_SECRET: ${REFRESH_SECRET:-daash-refresh-secret-change-me-in-production-0123456789abcdef}
      DTE_SIGNING_SECRET: ${DTE_SIGNING_SECRET:-daash-dte-signing-secret-change-me-in-production-0123456789abcdef}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SERVER_PORT: 8080
      SSL_ENABLED: ${SSL_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@daash.local}
      COMPANY_NAME: ${COMPANY_NAME:-Adventure Works S.A. de C.V.}
      COMPANY_NIT: ${COMPANY_NIT:-0614-123456-100-0}
      COMPANY_NRC: ${COMPANY_NRC:-1234-5}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-San Salvador, El Salvador}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: /api
    container_name: daash-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
